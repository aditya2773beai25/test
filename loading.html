<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2;url=index.html">
    <title>EventSphere | Loading</title>

    <!-- Google Fonts: Karla (body) + Unbounded (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg: #08090d;
            --color-bg-soft: #0e1018;
            --color-surface: #13161f;
            --color-text: #eef0f6;
            --color-text-secondary: #8b93a8;
            --color-accent: #f59e0b;
            --color-accent-hover: #fbbf24;
            --color-gradient-amber: linear-gradient(135deg, #f59e0b 0%, #f97316 50%, #ec4899 100%);
            --font-display: "Unbounded", system-ui, sans-serif;
            --font-body: "Karla", system-ui, sans-serif;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.65;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            animation: pageIn 0.45s var(--ease-out) both;
        }

        .loading-container {
            text-align: center;
            max-width: 500px;
            animation: fadeUp 0.6s var(--ease-out) 0.1s both;
        }

        .loading-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            animation: fadeUp 0.6s var(--ease-out) 0.2s both;
        }

        .loading-logo svg {
            width: 48px;
            height: 48px;
        }

        .loading-logo-text {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: var(--color-gradient-amber);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--color-surface);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 32px;
            animation: fadeUp 0.6s var(--ease-out) 0.3s both;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-gradient-amber);
            width: 0%;
            animation: loadingProgress 2s linear forwards;
            border-radius: 10px;
        }

        .loading-text {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 12px;
            animation: fadeUp 0.6s var(--ease-out) 0.4s both;
        }

        .loading-subtext {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            animation: fadeUp 0.6s var(--ease-out) 0.5s both;
        }
        @keyframes loadingProgress {
            0% { width: 0%; }
            25% { width: 25%; }
            50% { width: 50%; }
            75% { width: 75%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-logo">
            <svg viewBox="0 0 40 40" width="48" height="48">
                <circle cx="20" cy="20" r="7" fill="url(#logoGradient)"/>
                <ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
                <defs>
                    <linearGradient id="logoGradient" x1="0" y1="0" x2="40" y2="40">
                        <stop offset="0%" stop-color="#f59e0b"/>
                        <stop offset="100%" stop-color="#ec4899"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="loading-logo-text">EventSphere</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <p class="loading-text">Loading<span class="dots">...</span></p>
        <p class="loading-subtext">Preparing your campus events experience</p>
    </div>
</body>
</html>
